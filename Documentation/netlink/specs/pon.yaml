# SPDX-License-Identifier: ((GPL-2.0 WITH Linux-syscall-note) OR BSD-3-Clause)
---
name: pon

doc:
  Passive Optical Network device configuration over generic netlink.

  A PON device represents the ONU-side MAC of a GPON or XG(S)-PON link. The
  kernel owns activation (the PLOAM state machine, ranging and the key
  hierarchy run in hardware or in the driver, driven by MAC interrupts) and
  the datapath objects (T-CONTs and GEM ports). Userspace owns the management
  plane, OMCI, whose PDUs this family carries between the OMCC and the one
  socket that registered for them. This family also carries identity,
  datapath object configuration, state notifications and counters.

  An operation is a set when it can change an object that already exists
  and a new when it can only create one. A tcont-set rebinds a T-CONT, while
  a gem-new refuses a GEM port that exists with other attributes.

definitions:
  -
    type: enum
    name: mode
    doc: PON operating mode.
    entries: [gpon, xg-pon, xgs-pon]
  -
    type: enum
    name: ploam-state
    doc: |
      ITU-T G.9807.1 / G.984.3 ONU activation state. O5 is the only state in
      which the OMCC carries traffic. G.9807.1 has one Serial Number state,
      O2-3 (Table C.12.1), reported as o2. Only a G.984.3 device reports o3.
    entries: [unknown, o1, o2, o3, o4, o5, o6, o7]
  -
    type: enum
    name: event-type
    doc: |
      Discrete events reported by the driver, each one a thing that
      happened rather than a state. A condition that lasts is an alarm and
      goes through alarm-ntf and a PLOAM transition goes through
      ploam-ntf.
    entries:
      -
        name: mib-reset-req
        doc: The OLT requested an OMCI MIB reset (reboot request, depth 0).
      -
        name: reboot-req
        doc: The OLT requested an ONU reboot. The depth attribute says how
          deep, the image attribute which image to run after it and the
          calls attribute on which condition.
      -
        name: tcont-alloc
        doc: The OLT allocated a T-CONT. The alloc-id attribute names it.
      -
        name: tcont-dealloc
        doc: |
          The OLT deallocated an alloc-id with Assign_Alloc-ID of ITU-T
          G.9807.1. The alloc-id attribute names it. Its GEM ports carry no
          upstream traffic until the OLT allocates it again.
  -
    type: enum
    name: reboot-calls
    doc: |
      The condition on calls in progress that a reboot request carries, as
      the flags of the Reboot_ONU message of ITU-T G.9807.1 (Table C.11.23A,
      octet 16) define it. The kernel does not know the call state. The
      userspace that acts on the request applies the condition.
    entries:
      -
        name: any
        doc: Reboot regardless of the POTS or VoIP call state.
      -
        name: no-calls
        doc: Reboot only if no POTS or VoIP call is in progress.
      -
        name: no-emergency-calls
        doc: Reboot only if no emergency call is in progress.
  -
    type: enum
    name: gem-dir
    doc: |
      GEM port direction. The values are those of the direction attribute of
      the GEM port network CTP managed entity of ITU-T G.988: UNI-to-ANI (1),
      ANI-to-UNI (2) or bidirectional (3). An OMCI stack passes the value
      through.
    entries:
      -
        name: upstream
        value: 1
      -
        name: downstream
        value: 2
      -
        name: bidir
        value: 3
  -
    type: enum
    name: gem-key-ring
    doc: |
      Whether a GEM port is encrypted and with which keys, as the
      encryption key ring attribute of the GEM port network CTP managed
      entity of ITU-T G.988 clause 9.2.3 defines it.
    entries:
      -
        name: none
        doc: No encryption. Upstream is sent with key index 0.
      -
        name: unicast
        doc: |
          Unicast encryption in both directions, with the keys the ONU
          generates.
      -
        name: broadcast
        doc: |
          Broadcast encryption, with the keys the OLT distributes over the
          OMCI.
      -
        name: unicast-downstream
        doc: |
          Unicast encryption of the downstream only, with the keys the ONU
          generates.
  -
    type: enum
    name: gem-map-tag
    doc: VLAN tag state an upstream classifier rule matches.
    entries: [untagged, tagged]

  -
    type: enum
    name: alarm
    doc: |
      ONU defects of ITU-T G.9807.1 Table C.14.3. Each one is a level, not
      an edge: the driver raises it while the condition holds and clears it
      when the condition ends, so a lost notification costs nothing and
      alarm-get always carries the truth.
    entries:
      -
        name: lods
        doc: |
          Loss of downstream synchronization: the downstream
          synchronization state machine is in the Hunt or Pre-Sync state.
attribute-sets:
  -
    name: dev
    attributes:
      -
        name: id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: ifindex
        doc: ifindex of the PON data network device (the PON MAC port).
        type: u32
      -
        name: mode
        doc: Active PON mode.
        type: u32
        enum: mode
      -
        name: modes-cap
        doc: Bitmask of the modes the device supports.
        type: u32
        enum: mode
        enum-as-flags: true
      -
        name: serial
        doc: |
          ONU serial number, 8 bytes: the 4 ASCII characters of the Vendor_ID
          of ITU-T G.9807.1 clause C.11.2.6.1, then the 4 byte VSSN of clause
          C.11.2.6.2. Eight 0x00 bytes address every ONU (Table C.11.23A) and
          are refused.
        type: binary
        checks:
          exact-len: 8
      -
        name: registration-id
        doc: |
          Registration_ID of the Registration message of ITU-T G.9807.1
          (Table C.11.25), 1 to 36 bytes. An empty value is refused. The
          kernel pads a shorter value with 0x00 bytes to 36, as the note of
          the table recommends. Write only: it is a credential.
        type: binary
        checks:
          max-len: 36
      -
        name: ploam-state
        doc: Current activation state.
        type: u32
        enum: ploam-state
      -
        name: max-tconts
        doc: Number of T-CONTs the device supports.
        type: u32
      -
        name: max-gems
        doc: |
          Number of GEM ports gem-new can create, not counting the GEM port
          of the OMCC. gem-new answers -ENOSPC beyond it.
        type: u32
      -
        name: enable
        doc: |
          1 starts the ONU upstream link, 0 stops it. In a reply, whether the
          link was last started.
        type: u8
        checks:
          max: 1
  -
    name: tcont
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: index
        doc: |
          T-CONT index in the device, 0 based and below the max-tconts of
          the device.
        type: u32
        checks:
          max: 65534
      -
        name: alloc-id
        doc: |
          Alloc-ID bound to the T-CONT, as assigned by the OLT. ITU-T
          G.9807.1 clause C.6.1.5.7 bounds it at 16383.
        type: u32
        checks:
          max: 16383
  -
    name: gem
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: id
        doc: |
          GEM port ID, as the OLT assigns it over the OMCI. ITU-T G.9807.1
          Table C.6.6 reserves 0 to 1020 for the default Port-ID (equal
          to the ONU-ID, OMCC only) and 65535 for the idle Port-ID, so an
          assigned GEM port is 1021 to 65534.
        type: u32
        checks:
          min: 1021
          max: 65534
      -
        name: dir
        doc: Direction.
        type: u32
        enum: gem-dir
      -
        name: tcont-index
        doc: |
          T-CONT the upstream half rides. Required for an upstream or
          bidirectional GEM port. A downstream GEM port rides no T-CONT and
          is refused with this attribute.
        type: u32
        checks:
          max: 65534
      -
        name: key-ring
        doc: |
          Encryption key ring of the GEM port. Absent means none. The
          kernel refuses broadcast, since it takes no broadcast key.
        type: u32
        enum: gem-key-ring
  -
    name: gem-map
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: gem-id
        doc: GEM port the matching frames map to, 1021 to 65534 as for gem id.
        type: u32
        checks:
          min: 1021
          max: 65534
      -
        name: tag
        doc: Match the frame VLAN tag state. Absent matches either.
        type: u32
        enum: gem-map-tag
      -
        name: vid
        doc: Match the outer VLAN ID. Absent matches any.
        type: u32
        checks:
          max: 4094
      -
        name: pbit
        doc: Match the outer VLAN priority. Absent matches any.
        type: u32
        checks:
          max: 7
      -
        name: dscp
        doc: Match the IP DSCP field. Absent matches any.
        type: u32
        checks:
          max: 63
  -
    name: gem-stats
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: gem-id
        doc: GEM port the counters belong to, 1021 to 65534 as for gem id.
        type: u32
        checks:
          min: 1021
          max: 65534
      -
        name: rx-frames
        doc: GEM frames received.
        type: uint
      -
        name: rx-bytes
        doc: GEM payload bytes received.
        type: uint
      -
        name: tx-frames
        doc: GEM frames sent.
        type: uint
      -
        name: tx-bytes
        doc: GEM payload bytes sent.
        type: uint
  -
    name: omci
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: pdu
        doc: |
          One OMCI PDU, from the transaction correlation id to the end of the
          message contents: 44 bytes for the baseline format, the 10 byte
          header and the contents for the extended format of ITU-T G.988
          annex B. It carries no integrity field in either direction. The
          MAC adds the MIC upstream and checks it downstream. Upstream the
          device identifier selects the format and the length must match
          it: 44 bytes for 0x0a, 10 bytes plus the message contents length
          of the header for 0x0b. Any other PDU is refused.
        type: binary
        checks:
          max-len: 1976
  -
    name: event
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: type
        doc: What happened.
        type: u32
        enum: event-type
      -
        name: alloc-id
        doc: |
          The Alloc-ID the OLT allocated or deallocated. Present for
          tcont-alloc and tcont-dealloc only.
        type: u32
        checks:
          max: 16383
      -
        name: depth
        doc: |
          How deep a reboot the OLT asked for, as the reboot depth of the
          Reboot_ONU message of ITU-T G.9807.1, Table C.11.23A, defines
          it. Present for reboot-req only.
        type: u32
        checks:
          max: 3
      -
        name: image
        doc: |
          Which image to run after the reboot, as the reboot image of the
          Reboot_ONU message of ITU-T G.9807.1, Table C.11.23A, defines it:
          0 for the image that is committed now, 1 for the other one.
          Present for reboot-req only.
        type: u32
        checks:
          max: 1
      -
        name: calls
        doc: |
          On which condition the reboot may run, as the flags of the
          Reboot_ONU message of ITU-T G.9807.1, Table C.11.23A, define it.
          Present for reboot-req and mib-reset-req.
        type: u32
        enum: reboot-calls

  -
    name: fec
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: corrected
        doc: FEC corrected codewords, monotonic.
        type: uint
      -
        name: uncorrectable
        doc: FEC uncorrectable codewords, monotonic.
        type: uint
      -
        name: corrected-bytes
        doc: FEC corrected bytes, monotonic.
        type: uint
      -
        name: total-codewords
        doc: Codewords received, monotonic.
        type: uint
      -
        name: seconds
        doc: |
          Seconds in which at least one uncorrectable FEC codeword was
          received (ITU-T G.988 clause 9.2.9), monotonic.
        type: uint
  -
    name: tc-stats
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: psbd-hec-errors
        doc: |
          HEC errors in the fields of the downstream physical
          synchronization block, monotonic.
        type: uint
      -
        name: xgtc-hec-errors
        doc: |
          HEC errors in the XGTC header, which ITU-T G.9807.1 names the
          framing sublayer header, monotonic.
        type: uint
      -
        name: unknown-profiles
        doc: Grants that name a burst profile the ONU does not hold, monotonic.
        type: uint
      -
        name: tx-xgem-frames
        doc: |
          XGEM frames sent, idle frames left out. Each fragment of a
          fragmented frame counts. Monotonic.
        type: uint
      -
        name: tx-xgem-fragments
        doc: XGEM frames sent that are not the last fragment, monotonic.
        type: uint
      -
        name: xgem-hec-lost-words
        doc: Words of 4 bytes lost after an XGEM header HEC error, monotonic.
        type: uint
      -
        name: xgem-key-errors
        doc: XGEM frames received with a key index that is not valid, monotonic.
        type: uint
      -
        name: xgem-hec-errors
        doc: XGEM header HEC errors, monotonic.
        type: uint
      -
        name: tx-xgem-bytes
        doc: Bytes sent in XGEM frames, idle frames left out, monotonic.
        type: uint
      -
        name: rx-xgem-bytes
        doc: Bytes received in XGEM frames, idle frames left out, monotonic.
        type: uint
      -
        name: lods-events
        doc: |
          Losses of downstream synchronization, the edges O5 to O6,
          monotonic.
        type: uint
      -
        name: lods-restored
        doc: |
          Losses of downstream synchronization that ended with the
          synchronization back, the edges O6 to O5, monotonic.
        type: uint
      -
        name: lods-reactivations
        doc: |
          Losses of downstream synchronization that ended in a new
          activation, the edges O6 to O1, monotonic.
        type: uint
      -
        name: ploam-mic-errors
        doc: Downstream PLOAM messages with a wrong MIC, monotonic.
        type: uint
      -
        name: omci-mic-errors
        doc: Downstream OMCI messages with a wrong MIC, monotonic.
        type: uint
      -
        name: rx-ploam
        doc: Downstream PLOAM messages received, monotonic.
        type: uint
      -
        name: rx-burst-profile
        doc: Burst_Profile messages received, monotonic.
        type: uint
      -
        name: rx-ranging-time
        doc: Ranging_Time messages received, monotonic.
        type: uint
      -
        name: rx-deactivate-onu-id
        doc: Deactivate_ONU-ID messages received, monotonic.
        type: uint
      -
        name: rx-disable-serial-number
        doc: |
          Disable_Serial_Number messages received that name the serial
          number of this ONU, monotonic.
        type: uint
      -
        name: rx-request-registration
        doc: Request_Registration messages received, monotonic.
        type: uint
      -
        name: rx-assign-alloc-id
        doc: Assign_Alloc-ID messages received, monotonic.
        type: uint
      -
        name: rx-key-control
        doc: Key_Control messages received, monotonic.
        type: uint
      -
        name: rx-sleep-allow
        doc: Sleep_Allow messages received, monotonic.
        type: uint
      -
        name: rx-assign-onu-id
        doc: Assign_ONU-ID messages received, monotonic.
        type: uint
      -
        name: tx-ploam
        doc: |
          Upstream PLOAM messages sent, acknowledgments left out,
          monotonic.
        type: uint
      -
        name: tx-serial-number-onu
        doc: Serial_Number_ONU messages sent, monotonic.
        type: uint
      -
        name: tx-registration
        doc: Registration messages sent, monotonic.
        type: uint
      -
        name: tx-key-report
        doc: Key_Report messages sent, monotonic.
        type: uint
      -
        name: tx-acknowledge
        doc: Acknowledgment messages sent, monotonic.
        type: uint
      -
        name: tx-sleep-request
        doc: Sleep_Request messages sent, monotonic.
        type: uint
      -
        name: omci-rx
        doc: OMCI PDUs handed to the registered socket, monotonic.
        type: uint
      -
        name: omci-rx-dropped
        doc: |
          OMCI PDUs from the OLT that no socket received: none was
          registered, the queue towards it was full, or the socket had no
          room left. Monotonic.
        type: uint
      -
        name: omci-rx-errors
        doc: |
          OMCI PDUs that the MAC passed up unchecked and that failed the
          integrity check, monotonic.
        type: uint
      -
        name: omci-tx
        doc: OMCI PDUs handed to the MAC for the OLT, monotonic.
        type: uint
      -
        name: omci-tx-errors
        doc: |
          OMCI PDUs from the registered socket that the MAC refused,
          monotonic.
        type: uint
  -
    name: alarm
    attributes:
      -
        name: dev-id
        doc: PON device ID.
        type: u32
        checks:
          min: 1
      -
        name: alarms
        doc: Bitmask of the alarms raised now.
        type: u32
        enum: alarm
        enum-as-flags: true

operations:
  list:
    -
      name: dev-get
      doc: Get or dump PON devices.
      attribute-set: dev
      do:
        request:
          attributes:
            - id
        reply: &dev-all
          attributes:
            - id
            - ifindex
            - mode
            - modes-cap
            - serial
            - ploam-state
            - max-tconts
            - max-gems
            - enable
        pre: pon-device-get-locked
        post: pon-device-unlock
      dump:
        reply: *dev-all
    -
      name: dev-set
      doc: |
        Set the identity of a PON device, start or stop its upstream link, or
        any combination. While the link is enabled, a mode or a serial number
        other than the one the device holds is refused with EBUSY.
        The settings are applied before the link moves.
      attribute-set: dev
      flags: [admin-perm]
      do:
        request:
          attributes:
            - id
            - mode
            - serial
            - registration-id
            - enable
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: dev-add-ntf
      doc: Notification about a PON device appearing.
      notify: dev-get
      mcgrp: mgmt
    -
      name: dev-del-ntf
      doc: |
        Notification about a PON device disappearing. Every T-CONT, GEM port
        and classifier rule of the device goes with it, without a
        notification of its own.
      notify: dev-get
      mcgrp: mgmt
    -
      name: dev-change-ntf
      doc: Notification about a PON device configuration change.
      notify: dev-get
      mcgrp: mgmt
    -
      name: ploam-ntf
      doc: |
        The activation state changed. Every transition is reported, so the
        O5 edge, which is the OMCC becoming usable or unusable, is visible.
      attribute-set: dev
      mcgrp: state
      event:
        attributes:
          - id
          - ploam-state
    -
      name: tcont-get
      doc: |
        Get or dump T-CONTs. A dump with a device ID lists the T-CONTs of
        that device only.
      attribute-set: tcont
      do:
        request:
          attributes:
            - dev-id
            - index
        reply: &tcont-all
          attributes:
            - dev-id
            - index
            - alloc-id
        pre: pon-device-get-locked
        post: pon-device-unlock
      dump:
        request:
          attributes:
            - dev-id
        reply: *tcont-all
    -
      name: tcont-set
      doc: |
        Bind an alloc-id to a T-CONT, or rebind it. A rebind moves the GEM
        ports of the T-CONT too. If the driver refuses one, the old alloc-id
        stays on the T-CONT and on its GEM ports and the request fails.
      attribute-set: tcont
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
            - index
            - alloc-id
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: tcont-del
      doc: |
        Release a T-CONT. Fails with -EBUSY while a GEM port names the
        T-CONT. Delete the GEM ports first.
      attribute-set: tcont
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
            - index
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: tcont-add-ntf
      doc: A T-CONT object was created.
      notify: tcont-get
      mcgrp: mgmt
    -
      name: tcont-change-ntf
      doc: A T-CONT object changed.
      notify: tcont-get
      mcgrp: mgmt
    -
      name: tcont-del-ntf
      doc: A T-CONT object was removed.
      notify: tcont-get
      mcgrp: mgmt

    -
      name: gem-get
      doc: |
        Get or dump GEM ports. A dump with a device ID lists the GEM ports
        of that device only.
      attribute-set: gem
      do:
        request:
          attributes:
            - dev-id
            - id
        reply: &gem-all
          attributes:
            - dev-id
            - id
            - dir
            - tcont-index
            - key-ring
        pre: pon-device-get-locked
        post: pon-device-unlock
      dump:
        request:
          attributes:
            - dev-id
        reply: *gem-all
    -
      name: gem-new
      doc: |
        Create a GEM port. A GEM port that exists with the same attributes
        is accepted. One that exists with other attributes is refused.
      attribute-set: gem
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
            - id
            - dir
            - tcont-index
            - key-ring
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: gem-del
      doc: Destroy a GEM port.
      attribute-set: gem
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
            - id
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: gem-add-ntf
      doc: A GEM port object was created.
      notify: gem-get
      mcgrp: mgmt
    -
      name: gem-del-ntf
      doc: A GEM port object was removed.
      notify: gem-get
      mcgrp: mgmt

    -
      name: gem-map-get
      doc: |
        Dump the upstream classifier rules. The core keeps a copy of each
        rule that the driver took. A dump with a device ID lists the rules of
        that device only.
      attribute-set: gem-map
      dump:
        request:
          attributes:
            - dev-id
        reply:
          attributes:
            - dev-id
            - gem-id
            - tag
            - vid
            - pbit
            - dscp
    -
      name: gem-map-new
      doc: |
        Add one upstream classifier rule mapping frames onto a GEM port.
        A rule matches on the attributes it carries. A more specific rule
        wins over a less specific one.
      attribute-set: gem-map
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
            - gem-id
            - tag
            - vid
            - pbit
            - dscp
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: gem-map-del
      doc: Remove one upstream classifier rule.
      attribute-set: gem-map
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
            - gem-id
            - tag
            - vid
            - pbit
            - dscp
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: gem-map-add-ntf
      doc: An upstream classifier rule was created.
      notify: gem-map-get
      mcgrp: mgmt
    -
      name: gem-map-del-ntf
      doc: An upstream classifier rule was removed.
      notify: gem-map-get
      mcgrp: mgmt

    -
      name: omci-register
      doc: |
        Receive the OMCI PDUs of one device on this socket, as omci-ntf.
        One socket at a time owns the OMCI channel of a device. Another
        socket is refused with EBUSY until the owner closes. A registration
        ends only when its socket closes.
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: omci-tx
      doc: |
        Send one OMCI PDU to the OLT. Only the socket that owns the OMCI
        channel of the device may send and the MAC refuses a PDU while the
        ONU is not in O5.
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - dev-id
            - pdu
        pre: pon-device-get-locked
        post: pon-device-unlock
    -
      name: omci-ntf
      doc: |
        One OMCI PDU from the OLT, sent only to the socket that owns the
        OMCI channel of the device. A PDU that finds no room on that socket
        is lost. The OLT retries.
      attribute-set: omci
      event:
        attributes:
          - dev-id
          - pdu

    -
      name: event-ntf
      doc: A discrete driver event.
      attribute-set: event
      mcgrp: state
      event:
        attributes:
          - dev-id
          - type
          - alloc-id
          - depth
          - image
          - calls

    -
      name: gem-stats-get
      doc: |
        Get the counters of one GEM port, or dump all of them. A dump with a
        device ID lists the GEM ports of that device only.
      attribute-set: gem-stats
      do:
        request:
          attributes:
            - dev-id
            - gem-id
        reply: &gem-stats-all
          attributes:
            - dev-id
            - gem-id
            - rx-frames
            - rx-bytes
            - tx-frames
            - tx-bytes
        pre: pon-device-get-locked
        post: pon-device-unlock
      dump:
        request:
          attributes:
            - dev-id
        reply: *gem-stats-all

    -
      name: fec-get
      doc: |
        Get the FEC counters of one device. They belong to the device and
        not to a GEM port, so there is no dump. Enumerate the devices with
        dev-get.
      attribute-set: fec
      do:
        request:
          attributes:
            - dev-id
        reply:
          attributes:
            - dev-id
            - corrected
            - uncorrectable
            - corrected-bytes
            - total-codewords
            - seconds
        pre: pon-device-get-locked
        post: pon-device-unlock

    -
      name: tc-stats-get
      doc: |
        Get the counters of the transmission convergence layer of one
        device: the header and key errors, the XGEM totals, the losses of
        downstream synchronization and the PLOAM messages by type. ITU-T
        G.988 reports them through the XG-PON TC, the downstream management
        and the upstream management performance monitoring managed entities.
        A counter that the device does not keep is absent. There is no dump.
        Enumerate the devices with dev-get.
      attribute-set: tc-stats
      do:
        request:
          attributes:
            - dev-id
        reply:
          attributes:
            - dev-id
            - psbd-hec-errors
            - xgtc-hec-errors
            - unknown-profiles
            - tx-xgem-frames
            - tx-xgem-fragments
            - xgem-hec-lost-words
            - xgem-key-errors
            - xgem-hec-errors
            - tx-xgem-bytes
            - rx-xgem-bytes
            - lods-events
            - lods-restored
            - lods-reactivations
            - ploam-mic-errors
            - omci-mic-errors
            - rx-ploam
            - rx-burst-profile
            - rx-ranging-time
            - rx-deactivate-onu-id
            - rx-disable-serial-number
            - rx-request-registration
            - rx-assign-alloc-id
            - rx-key-control
            - rx-sleep-allow
            - rx-assign-onu-id
            - tx-ploam
            - tx-serial-number-onu
            - tx-registration
            - tx-key-report
            - tx-acknowledge
            - tx-sleep-request
            - omci-rx
            - omci-rx-dropped
            - omci-rx-errors
            - omci-tx
            - omci-tx-errors
        pre: pon-device-get-locked
        post: pon-device-unlock

    -
      name: alarm-get
      doc: Get the alarms raised on one device, or dump every device.
      attribute-set: alarm
      do:
        request:
          attributes:
            - dev-id
        reply: &alarm-all
          attributes:
            - dev-id
            - alarms
        pre: pon-device-get-locked
        post: pon-device-unlock
      dump:
        reply: *alarm-all
    -
      name: alarm-ntf
      doc: |
        The set of raised alarms changed. The whole bitmap is sent, so a
        reader that misses one notification is still correct after the next.
      notify: alarm-get
      mcgrp: state

mcast-groups:
  list:
    -
      name: mgmt
    -
      name: state

...
